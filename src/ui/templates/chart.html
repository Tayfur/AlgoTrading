<!DOCTYPE html>
<html>
<head>
    <title>BTC Trading Analyzer</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { 
            background: #131722; 
            color: #d1d4dc;
            margin: 0;
            padding: 20px;
        }
        #chart {
            width: 100%;
            height: 600px;
        }
        #timeframe-selector {
            margin-bottom: 20px;
        }
        .timeframe-btn {
            background: #2962FF;
            color: white;
            border: none;
            padding: 8px 16px;
            margin-right: 10px;
            cursor: pointer;
            border-radius: 4px;
        }
        .timeframe-btn.active {
            background: #1E88E5;
        }
        #signals {
            margin-top: 20px;
            padding: 10px;
            background: #1e222d;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="timeframe-selector">
        <button class="timeframe-btn active" data-tf="5m">5 Min</button>
        <button class="timeframe-btn" data-tf="30m">30 Min</button>
        <button class="timeframe-btn" data-tf="1h">1 Hour</button>
    </div>
    <div id="chart"></div>
    <div id="signals"></div>
    <script>
        let currentTimeframe = '5m';
        let ws = null;
        
        function formatDate(time) {
            const date = new Date(time * 1000); // Convert Unix timestamp to milliseconds
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const day = date.getDate();
            const month = months[date.getMonth()];
            const year = date.getFullYear();
            const hours = date.getHours().toString().padStart(2, '0');
            const minutes = date.getMinutes().toString().padStart(2, '0');
            
            return `${day} ${month} ${year} ${hours}:${minutes}`;
        }

        function formatPrice(price) {
            return price.toLocaleString('en-US', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        function formatDateTime(time) {
            // Convert milliseconds to seconds if needed
            const timestamp = time > 1e10 ? time / 1000 : time;
            const date = new Date(timestamp * 1000);
            
            // Format date components
            const day = date.getDate().toString().padStart(2, '0');
            const month = (date.getMonth() + 1).toString().padStart(2, '0');
            const year = date.getFullYear();
            const hours = date.getHours().toString().padStart(2, '0');
            const minutes = date.getMinutes().toString().padStart(2, '0');
            
            return `${day}/${month}/${year} ${hours}:${minutes}`;
        }

        // Add these helper functions
        let rafId = null;

        function debounceRaf(callback) {
            if (rafId) cancelAnimationFrame(rafId);
            rafId = requestAnimationFrame(callback);
        }

        const chart = LightweightCharts.createChart(document.getElementById('chart'), {
            width: window.innerWidth - 40,
            height: 600,
            layout: {
                background: { color: '#131722' },
                textColor: '#d1d4dc',
                rightMargin: 12,  // Additional right margin
            },
            grid: {
                vertLines: { color: '#242732' },
                horzLines: { color: '#242732' },
            },
            crosshair: {
                mode: LightweightCharts.CrosshairMode.Normal,
            },
            rightPriceScale: {
                borderColor: '#242732',
                mode: LightweightCharts.PriceScaleMode.Normal,
                autoScale: true,
                scaleMargins: {
                    top: 0.1,
                    bottom: 0.1,
                },
            },
            timeScale: {
                rightOffset: 12,  // Add space on the right
                fixLeftEdge: false,
                lockVisibleTimeRangeOnResize: true,
                rightBarStaysOnScroll: true,
                barSpacing: 6,
                minBarSpacing: 4,
                timeVisible: true,
                secondsVisible: false,
                borderColor: '#D1D4DC',
                fontSize: 10
            },
            handleScroll: {
                mouseWheel: true,
                pressedMouseMove: true,
            },
            handleScale: {
                axisPressedMouseMove: true,
                mouseWheel: true,
                pinch: true,
            },
            watermark: {
                visible: false,
            },
            // Add performance optimizations
            optimizeForCurrentTime: true,
            renderingInProgress: () => {
                // Prevent multiple renders
                if (chart.renderingInProgress) return;
                chart.renderingInProgress = true;
                requestAnimationFrame(() => {
                    chart.renderingInProgress = false;
                });
            }
        });

        // Add throttling for updates
        let updateTimeout = null;
        function throttledUpdate(data) {
            if (!updateTimeout) {
                updateTimeout = setTimeout(() => {
                    updateChart(data);
                    updateTimeout = null;
                }, 100); // Throttle to max 10 updates per second
            }
        }

        const candleSeries = chart.addCandlestickSeries({
            upColor: '#26a69a',
            downColor: '#ef5350',
            borderVisible: false,
            wickUpColor: '#26a69a',
            wickDownColor: '#ef5350',
        });

        const signalMarkers = [];
        let supportLines = [];
        let resistanceLines = [];
        const { LineStyle } = LightweightCharts;

        let lastUpdateTime = 0;
        const updateInterval = 1000; // 1 second minimum between updates
        let currentLevels = [];

        // Add data validation and caching
        const candleCache = new Map();
        const UPDATE_THROTTLE = 100; // ms

        function isValidCandle(candle) {
            if (!candle) return false;
            console.log('Validating candle:', candle); // Debug log
            return true;
        }

        function updateChart(data) {
            if (!data.candle || !isValidCandle(data.candle)) {
                console.warn('Invalid candle data received');
                return;
            }

            const now = Date.now();
            if (now - lastUpdateTime < UPDATE_THROTTLE) return;
            lastUpdateTime = now;

            const candleData = {
                time: Math.floor(parseInt(data.candle.Time) / 1000),
                open: parseFloat(data.candle.Open),
                high: parseFloat(data.candle.High),
                low: parseFloat(data.candle.Low),
                close: parseFloat(data.candle.Close)
            };

            candleCache.set(candleData.time, candleData);
            requestAnimationFrame(() => {
                try {
                    candleSeries.update(candleData);
                } catch (e) {
                    console.error('Error updating candle:', e);
                }
            });
        }

        function connectWebSocket() {
            if (ws) {
                ws.close();
            }

            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${wsProtocol}//${window.location.host}/ws`);
            
            // Store candle data for each timeframe
            const candleData = {
                '5m': [],
                '30m': [],
                '1h': []
            };
            
            ws.onopen = function() {
                console.log('WebSocket Connected');
                // Request initial data
                requestData(currentTimeframe);
                
                // Set up periodic data refresh
                setInterval(() => {
                    if (ws.readyState === WebSocket.OPEN) {
                        requestData(currentTimeframe);
                    }
                }, 1000); // Update every second
            };

            let lastLevelsUpdate = 0;
            const LEVELS_UPDATE_INTERVAL = 50000; // 5 seconds
            let cachedLevels = [];

            function shouldUpdateLevels(newLevels) {
                if (!Array.isArray(newLevels)) return false;
                
                // Check time threshold
                const now = Date.now();
                if (now - lastLevelsUpdate < LEVELS_UPDATE_INTERVAL) return false;
                
                // Check if levels changed significantly
                const levelsChanged = JSON.stringify(newLevels) !== JSON.stringify(cachedLevels);
                if (!levelsChanged) return false;
                
                lastLevelsUpdate = now;
                cachedLevels = newLevels;
                return true;
            }

            // Update the WebSocket message handler
            ws.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    console.log('WebSocket message:', data); // Debug log

                    if (data.type === 'history' && Array.isArray(data.candles)) {
                        console.log('Candles count:', data.candles.length); // Debug log
                        
                        const chartData = data.candles
                            .filter(candle => {
                                const isValid = isValidCandle(candle);
                                if (!isValid) console.log('Invalid candle:', candle);
                                return isValid;
                            })
                            .map(candle => {
                                const transformed = transformCandle(candle);
                                console.log('Transformed candle:', transformed);
                                return transformed;
                            });

                        console.log('Final chart data:', chartData); // Debug log
                        
                        if (chartData.length > 0) {
                            candleSeries.setData(chartData);
                        }
                    }

                    // Handle levels update with throttling
                    if (data.levels && shouldUpdateLevels(data.levels)) {
                        updateSupportResistanceLines(data.levels);
                    }
                } catch (error) {
                    console.error('Processing error:', error);
                }
            };

            ws.onerror = function(error) {
                console.error('WebSocket error:', error);
            };

            ws.onclose = function() {
                console.log('WebSocket disconnected, reconnecting...');
                setTimeout(connectWebSocket, 5000);
            };
        }

        function requestData(timeframe) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'subscribe',
                    timeframe: timeframe
                }));
            }
        }

        function updateSupportResistanceLines(levels) {
            if (!Array.isArray(levels)) {
                console.warn('Invalid levels data:', levels);
                return;
            }
            console.log('Updating levels:', levels);

            // Remove old lines
            [...supportLines, ...resistanceLines].forEach(line => {
                if (line) {
                    try {
                        candleSeries.removePriceLine(line);
                    } catch (e) {
                        console.warn('Error removing line:', e);
                    }
                }
            });
            supportLines = [];
            resistanceLines = [];

            // Add new lines
            levels.forEach(level => {
                try {
                    const line = candleSeries.createPriceLine({
                        price: Number(level.Price),
                        color: level.Type === 'support' ? '#26a69a' : '#ef5350',
                        lineWidth: 2,
                        lineStyle: LightweightCharts.LineStyle.Dashed,
                        axisLabelVisible: true,
                        title: `${level.Type.toUpperCase()} (${level.TouchCount})`,
                    });

                    if (level.Type === 'support') {
                        supportLines.push(line);
                    } else {
                        resistanceLines.push(line);
                    }
                } catch (e) {
                    console.error('Error creating line:', e);
                }
            });
        }

        function loadHistoricalData(candles) {
            if (!Array.isArray(candles) || candles.length === 0) return;
            
            const chartData = processCandles(candles);

            // Sort data by time
            chartData.sort((a, b) => a.time - b.time);
            
            // Set the data to the chart
            candleSeries.setData(chartData);
        }

        function processCandles(candles) {
            return candles.map(candle => ({
                time: Math.floor(new Date(candle.time).getTime() / 1000),
                open: parseFloat(candle.open),
                high: parseFloat(candle.high),
                low: parseFloat(candle.low),
                close: parseFloat(candle.close)
            }));
        }

        function updateSignals(signal) {
            const signalsDiv = document.getElementById('signals');
            const color = signal.Type === 'up' ? '#26a69a' : '#ef5350';
            const html = `
                <div style="color: ${color}; margin: 5px 0;">
                    ${signal.TimeFrame}: ${signal.Type.toUpperCase()} 
                    Price: $${signal.Price.toFixed(2)} 
                    Risk: ${signal.Risk.toFixed(1)}%
                </div>
            `;
            signalsDiv.innerHTML = html + signalsDiv.innerHTML;
        }

        // Handle timeframe selection
        document.querySelectorAll('.timeframe-btn').forEach(button => {
            button.addEventListener('click', function() {
                document.querySelectorAll('.timeframe-btn').forEach(btn => btn.classList.remove('active'));
                this.classList.add('active');
                currentTimeframe = this.dataset.tf;
                
                // Clear current data
                candleSeries.setData([]);
                
                // Request new timeframe data
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'subscribe',
                        timeframe: currentTimeframe
                    }));
                }
            });
        });

        // Initial connection
        connectWebSocket();

        window.addEventListener('resize', () => {
            chart.applyOptions({
                width: window.innerWidth - 40,
            });
        });

        function transformCandle(candle) {
            console.log('Raw candle:', candle); // Debug log
            return {
                time: Math.floor(Number(candle.time || candle.Time) / 1000),
                open: Number(candle.open || candle.Open),
                high: Number(candle.high || candle.High),
                low: Number(candle.low || candle.Low),
                close: Number(candle.close || candle.Close)
            };
        }

        // Initial data request
        ws.send(JSON.stringify({
            type: 'subscribe',
            timeframe: '5m' // or your default timeframe
        }));

    </script>
</body>
</html>
